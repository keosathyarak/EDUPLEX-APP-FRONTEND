name: EduPlex
description: "A new Flutter project."

# Prevent publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

# ================= DEPENDENCIES =================
dependencies:
  flutter:
    sdk: flutter
  youtube_player_flutter: ^9.1.0

  http: ^1.2.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  image_picker: ^1.2.1
  file_picker: ^8.1.2

# ================= DEV DEPENDENCIES =================
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# ================= FLUTTER CONFIG =================
flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/

  fonts:
    - family: KellySlab
      fonts:
        - asset: assets/fonts/KellySlab-Regular.ttf
          weight: 700

    - family: JainiPurva
      fonts:
        - asset: assets/fonts/JainiPurva-Regular.ttf
          weight: 700

# ================= APP ICON CONFIG =================
flutter_icons:
  android: true
  image_path: assets/icon/eduplexlogo.PNGu
