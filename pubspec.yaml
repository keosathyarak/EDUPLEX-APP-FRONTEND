name: EduPlex
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  youtube_player_flutter: ^9.1.0
  image_picker: ^1.2.1
  file_picker: ^8.1.2
  qr_flutter: ^4.1.0
  gal: ^2.3.2
  share_plus: ^7.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/

  fonts:
    - family: KellySlab
      fonts:
        - asset: assets/fonts/KellySlab-Regular.ttf

    - family: JainiPurva
      fonts:
        - asset: assets/fonts/JainiPurva-Regular.ttf

flutter_icons:
  android: true
  ios: true
  image_path: assets/icon/eduplexlogo.png